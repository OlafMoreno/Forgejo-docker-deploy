services:
  server:
    image: codeberg.org/forgejo/forgejo:9
    container_name: forgejo
    environment:
      USER_UID: ${FORGEJO_UID:?Define FORGEJO_UID en .env}
      USER_GID: ${FORGEJO_GID:?Define FORGEJO_GID en .env}
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: db:${POSTGRES_PORT:?Define POSTGRES_PORT en .env}
      FORGEJO__database__NAME: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      FORGEJO__database__USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      FORGEJO__database__PASSWD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      FORGEJO__server__SSH_PORT: ${FORGEJO_SSH_PORT:?Define FORGEJO_SSH_PORT en .env}
      FORGEJO__server__DOMAIN: ${FORGEJO_DOMAIN:?Define FORGEJO_DOMAIN en .env}
      FORGEJO__server__ROOT_URL: ${FORGEJO_ROOT_URL:?Define FORGEJO_ROOT_URL en .env}
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: ${FORGEJO_REQUIRE_SIGNIN_VIEW:?Define FORGEJO_REQUIRE_SIGNIN_VIEW en .env}
      FORGEJO__server__LANDING_PAGE: ${FORGEJO_LANDING_PAGE:?Define FORGEJO_LANDING_PAGE en .env}
    restart: always
    networks:
      - forgejo-net
    volumes:
      - ./forgejo-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${FORGEJO_HTTP_PORT:?Define FORGEJO_HTTP_PORT en .env}:3000"
      - "${FORGEJO_SSH_PORT:?Define FORGEJO_SSH_PORT en .env}:22"
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: forgejo-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    networks:
      - forgejo-net
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

networks:
  forgejo-net:
    driver: bridge